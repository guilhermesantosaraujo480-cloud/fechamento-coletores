# Copie para .streamlit/secrets.toml (local) ou cole em Settings > Secrets (Streamlit Cloud).
# NUNCA suba este arquivo preenchido para o GitHub.

SUPABASE_URL = "https://SEU-PROJETO.supabase.co"
SUPABASE_KEY = "chave-service_role-aqui"        # depois do PASSO 3 do migracao.sql

# --- Valor pago por aparelho (padrão 10) e câmera leve ---
# VALOR_POR_COLETA = 10
# FOTO_LEVE = "sim"     # o celular do coletor reduz a foto ANTES de enviar (menos internet/memória). Teste no seu celular antes!

# --- Identificação de quem envia (obrigatório para disparar e-mails) ---
EMPRESA_NOME = "Nome da sua empresa"
EMPRESA_IDENTIFICACAO = "CNPJ 00.000.000/0001-00 · contato@suaempresa.com.br"

# --- E-mail ---
WHATSAPP_NUMERO = "5511999999999"
URL_FUNCAO_CLIQUE = "https://SEU-PROJETO.supabase.co/functions/v1/super-function"  # opcional (contador de cliques)
VALOR_MULTA = ""        # ex.: "R$ 385" — só preencha se for um valor oficial e verdadeiro; vazio = texto genérico
CHAVE_CRIPTO = ""       # gere com: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
                        # DEVE ser igual ao secret CHAVE_CRIPTO do GitHub (Settings > Secrets and variables > Actions)

# --- Disparo em segundo plano: acionar o GitHub Actions na hora (opcional; sem isto roda a cada 30 min) ---
GITHUB_REPO = "seu-usuario/seu-repositorio"
GITHUB_TOKEN_DISPARO = ""          # token fine-grained com permissão "Actions: Read and write" só neste repositório
GITHUB_WORKFLOW = "disparador.yml" # nome do arquivo em .github/workflows (não traduza!)
GITHUB_BRANCH = "main"
GITHUB_WORKFLOW_SMS = "sms.yml"   # opcional: aciona o envio de SMS na hora (nome do arquivo, não traduza)

# --- IA gratuita (Google Gemini) ---
GEMINI_API_KEY = ""     # chave grátis em https://aistudio.google.com
GEMINI_MODEL = "gemini-flash-latest"   # sempre o Flash mais novo (o gemini-2.0-flash foi desligado em 06/2026). Se falhar, o sistema tenta outro Flash sozinho

# --- Rotas / WhatsApp: envio automático pelo grupo (opcional; sem isto o envio é manual pelo link) ---
# Atenção: gateways não oficiais podem ter o número banido. Use um chip dedicado.
