# --- Rotas → WhatsApp (opcional; sem isso o app funciona em modo manual: gera os arquivos e você envia) ---
# ATENÇÃO: a API oficial do WhatsApp NÃO posta em grupos. Estes gateways são NÃO oficiais (risco de banimento do número):
# use um chip dedicado, nunca o número principal da empresa.
WHATS_PROVEDOR = ""        # "evolution" ou "zapi"
WHATS_API_URL = ""         # evolution: https://sua-evolution.exemplo.com | zapi: https://api.z-api.io/instances/ID/token/TOKEN
WHATS_INSTANCIA = ""       # só Evolution: nome da instância
WHATS_API_KEY = ""         # só Evolution
WHATS_CLIENT_TOKEN = ""    # só Z-API

# --- Disparo em segundo plano (opcional: só para o trabalhador começar NA HORA em vez de esperar até 30 min) ---
GITHUB_REPO = ""           # ex.: "seuusuario/sistema-coletas"
GITHUB_TOKEN_DISPARO = ""  # token fino do GitHub (Fine-grained) só neste repositório, permissão Actions: Read and write
GITHUB_WORKFLOW = "disparador.yml"
GITHUB_BRANCH = "main"
