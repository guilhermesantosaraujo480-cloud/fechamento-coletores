# Confere, a cada envio ao GitHub, se algum arquivo ficou vazio ou trocado (já aconteceu: app.py, agente, README).
# Se algo estiver errado, esta verificação fica VERMELHA na aba Actions e o GitHub avisa por e-mail.
name: Verificar arquivos

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Conferir arquivos (vazios, trocados, código quebrado)
        run: python verificar_projeto.py
