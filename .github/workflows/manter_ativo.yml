# Mantém o app acordado (melhor esforço). O Streamlit gratuito "dorme" depois de um tempo sem visitas e o
# primeiro acesso demora. Este aviso passa a cada 4 horas. Só roda se você criar a variável APP_URL:
# GitHub > Settings > Secrets and variables > Actions > aba Variables > New repository variable
#   Nome: APP_URL     Valor: https://SEU-APP.streamlit.app
name: Manter app ativo

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Visitar o app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL não definida: nada a fazer."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 -L "$APP_URL" || echo "erro")
          echo "resposta: $code"
